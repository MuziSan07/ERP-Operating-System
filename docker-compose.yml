# Local development database. Passwords come from .env (git-ignored); see .env.example.
services:
  mysql:
    image: mysql:8.4
    container_name: erpos-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: erpos
      MYSQL_USER: erpos
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?copy .env.example to .env and set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?copy .env.example to .env and set MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - erpos-mysql-data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]

volumes:
  erpos-mysql-data:
